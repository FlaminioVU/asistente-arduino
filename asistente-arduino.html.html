<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistente Arduino</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800;900&display=swap">
<style>
:root{--bg:#eef1ec;--card:#fff;--ink:#12302b;--mut:#4d6560;--ac:#00878f;--acs:#d5eceb;--cu:#a8641c;--line:#c9d4cf;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c1a;--card:#172826;--ink:#e6f0ed;--mut:#9fb8b2;--ac:#4fc3c9;--acs:#1c3b3a;--cu:#e0a05a;--line:#2c4540}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;line-height:1.2;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 18px}
form{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.go{background:var(--ac);color:#fff;padding:0 18px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go{color:#08201f}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.chip{background:var(--acs);color:var(--ink);padding:8px 12px;font-size:.92rem;border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ac);border-radius:6px 12px 12px 6px;padding:16px 18px;margin:14px 0}
.card h2{font-size:1.25rem;margin:0 0 8px}
.card h3{font-size:1.02rem;margin:16px 0 6px;color:var(--cu)}
.card p{margin:6px 0}
.card ul{margin:6px 0;padding-left:20px}
li{margin:4px 0}
.you{margin:20px 0 0;text-align:right;color:var(--mut);font-size:.92rem}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:600;list-style:none}
summary::before{content:"+ ";color:var(--ac);font-weight:700}
details[open] summary::before{content:"– "}
.tag{display:inline-block;font-size:.8rem;background:var(--acs);border-radius:6px;padding:1px 8px;margin-left:6px;color:var(--mut);font-weight:400}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.part{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.part b{display:block}
.note{color:var(--mut);font-size:.92rem}
svg{display:block;width:100%;height:auto}
.pc{fill:#0a7c85}.bl{fill:#2d7fc1}.mt{fill:#c3cacb}.dk{fill:#2b3a38}.gd{fill:#c98a3c}.rd{fill:#d64545}.wh{fill:#f2f4f2}
.pc,.bl,.mt,.dk,.gd,.rd,.wh{stroke:rgba(0,0,0,.4);stroke-width:.8}
.tw{fill:#fff;font:600 9px system-ui,sans-serif}.td{fill:#1b2523;font:600 9px system-ui,sans-serif}.tx{fill:var(--ink);font:600 10px system-ui,sans-serif}
summary{display:flex;align-items:center;gap:12px}
.ico{width:72px;flex:none}.ico.big{width:120px}
.fig{max-width:460px;margin:8px auto 14px}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:8px 0}
.boards figure{margin:0;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg)}
.boards figcaption{font-size:.9rem;margin-top:6px}
.code{display:block;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:6px 0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 14px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.opt.ok{background:#cdeedd;border-color:#2e9b63;color:#0d3a24}.opt.no{background:#f7d4d4;border-color:#c24a4a;color:#4a1414}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.34;color:var(--ac)}
#bg svg{width:100%;height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #bg{opacity:.62}}
@keyframes pl{50%{opacity:.3}}
.pulse{animation:pl 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
#sig{position:fixed;z-index:-1;pointer-events:none;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;max-width:min(92vw,720px);text-align:right;color:var(--ac);font-family:Orbitron,Impact,"Arial Black",sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.04em;line-height:1.15;text-shadow:0 2px 12px rgba(0,135,143,.35)}
#sig b{display:block;font-size:clamp(1.15rem,3.6vw,2.4rem)}
#sig span{display:block;margin-bottom:6px;font-size:clamp(.8rem,2.2vw,1.35rem);color:var(--cu);font-weight:800}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #sig{text-shadow:0 0 18px var(--ac)}}
main{padding-top:clamp(112px,16vw,152px)}
</style>
</head>

var CODE={
dht11:'// Instala la librería "DHT sensor library" (Adafruit)\n#include <DHT.h>\nDHT dht(2, DHT11); // dato en pin 2\nvoid setup(){ Serial.begin(9600); dht.begin(); }\nvoid loop(){\n  Serial.println(dht.readTemperature());\n  delay(2000);\n}',
ldr:'void setup(){ Serial.begin(9600); }\nvoid loop(){\n  int luz = analogRead(A0);\n  Serial.println(luz);\n  delay(500);\n}',
hcsr04:'const int TRIG=9, ECHO=10;\nvoid setup(){\n  Serial.begin(9600);\n  pinMode(TRIG, OUTPUT); pinMode(ECHO, INPUT);\n}\nvoid loop(){\n  digitalWrite(TRIG, LOW); delayMicroseconds(2);\n  digitalWrite(TRIG, HIGH); delayMicroseconds(10);\n  digitalWrite(TRIG, LOW);\n  long t = pulseIn(ECHO, HIGH);\n  Serial.println(t * 0.034 / 2); // cm\n  delay(300);\n}',
pir:'void setup(){ Serial.begin(9600); pinMode(2, INPUT); pinMode(13, OUTPUT); }\nvoid loop(){\n  bool mov = digitalRead(2);\n  digitalWrite(13, mov);\n  if (mov) Serial.println("Movimiento");\n  delay(200);\n}',
pot:'void setup(){ Serial.begin(9600); }\nvoid loop(){\n  int v = analogRead(A0);\n  int brillo = map(v, 0, 1023, 0, 255);\n  analogWrite(9, brillo); // LED en pin 9\n  Serial.println(v);\n}',
suelo:'void setup(){ Serial.begin(9600); }\nvoid loop(){\n  int h = analogRead(A0);\n  // el umbral cambia según tu sensor: pruébalo\n  if (h > 600) Serial.println("Tierra seca");\n  else Serial.println("Tierra húmeda");\n  delay(1000);\n}',
mq:'void setup(){ Serial.begin(9600); pinMode(8, OUTPUT); }\nvoid loop(){\n  int gas = analogRead(A0);\n  Serial.println(gas);\n  digitalWrite(8, gas > 400); // alarma\n  delay(500);\n}',
lm35:'void setup(){ Serial.begin(9600); }\nvoid loop(){\n  int lec = analogRead(A0);\n  float grados = lec * 5.0 * 100.0 / 1024.0;\n  Serial.println(grados);\n  delay(1000);\n}',
ir:'void setup(){ Serial.begin(9600); pinMode(7, INPUT); }\nvoid loop(){\n  if (digitalRead(7) == LOW) Serial.println("Objeto detectado");\n  delay(200);\n}',
sonido:'void setup(){ Serial.begin(9600); }\nvoid loop(){\n  int ruido = analogRead(A0);\n  Serial.println(ruido);\n  delay(100);\n}',
boton:'void setup(){ pinMode(2, INPUT_PULLUP); pinMode(13, OUTPUT); }\nvoid loop(){\n  // con pull-up, presionado = LOW\n  digitalWrite(13, digitalRead(2) == LOW);\n}'
};

var INTRO='<div class="card"><h2>¿Qué es Arduino?</h2><p>Arduino es una plataforma de electrónica libre formada por una <b>placa con un microcontrolador</b> (un mini computador de un solo chip) y un programa para escribirle instrucciones. Puedes conectarle sensores, luces, motores y pantallas, y hacer que reaccionen al mundo real.</p><h3>¿Cómo funciona?</h3><ul><li><b>1. Escribes un programa</b> (“sketch”) en el Arduino IDE, en lenguaje parecido a C++.</li><li><b>2. Lo cargas</b> a la placa por cable USB.</li><li><b>3. La placa lo ejecuta en bucle:</b> <code>setup()</code> corre una vez para configurar, y <code>loop()</code> se repite sin parar.</li><li><b>4. Lee entradas</b> (sensores, botones), <b>decide</b> según tu código y <b>activa salidas</b> (LED, motores, buzzer).</li></ul><h3>Partes de una placa Arduino UNO</h3><div class="fig">'+uno(true)+'</div><div class="parts"><div class="part"><b>Microcontrolador ATmega328P</b>Es el cerebro: ejecuta tu programa.</div><div class="part"><b>Pines digitales (0–13)</b>Entradas o salidas de encendido/apagado. Algunos con PWM (~) simulan valores intermedios.</div><div class="part"><b>Pines analógicos (A0–A5)</b>Leen voltajes variables de 0 a 5 V.</div><div class="part"><b>Puerto USB</b>Carga el programa y alimenta la placa.</div><div class="part"><b>Conector de alimentación</b>Para batería o fuente de 7–12 V.</div><div class="part"><b>Pines de energía</b>5V, 3.3V y GND (tierra) para alimentar componentes.</div><div class="part"><b>Botón reset</b>Reinicia el programa.</div><div class="part"><b>Cristal oscilador</b>Marca el ritmo (16 MHz).</div><div class="part"><b>LED integrado (pin 13)</b>Sirve para tu primera prueba.</div></div><h3>Placas Arduino más comunes</h3><div class="boards"><figure>'+uno(false)+'<figcaption><b>UNO</b> La más popular y la mejor para empezar. 14 pines digitales y 6 analógicos.</figcaption></figure><figure>'+nano()+'<figcaption><b>Nano</b> Pequeña, cabe en una protoboard. Mismo cerebro que la UNO.</figcaption></figure><figure>'+mega()+'<figcaption><b>Mega 2560</b> Para proyectos grandes: 54 pines digitales y 16 analógicos.</figcaption></figure></div><h3>¿Qué se puede hacer?</h3><ul><li>Domótica: luces, puertas y riego automáticos</li><li>Robots que se mueven y esquivan obstáculos</li><li>Estaciones meteorológicas y registradores de datos</li><li>Alarmas, relojes y pantallas LCD</li><li>Juguetes, instrumentos musicales y proyectos escolares</li></ul><p class="note">Pregunta “¿qué sensores básicos puedo conectar?” para ver los más usados.</p></div>';
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
